name: Cloud Desktop RDP

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Password for RDP login'
        required: true
        default: 'AdminPass12345!'

jobs:
  start-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable Windows RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "${{ github.event.inputs.rdp_password }}"

      - name: Install & Start Tailscale
        shell: powershell
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale.exe"
          Start-Process -FilePath ".\tailscale.exe" -ArgumentList "/quiet" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TS_KEY" --hostname="cloud-desktop" --unattended

      - name: Keep Active (6 Hours)
        shell: powershell
        run: |
          Write-Host "RDP is online. Connect using Tailscale IP."
          Start-Sleep -Seconds 21600
